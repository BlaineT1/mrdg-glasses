<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude</title>
<meta name="description" content="Ask Claude from Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { width: 600px; height: 600px; overflow: hidden; padding: 24px; touch-action: none; position: relative; }
  #top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 26px; margin: 0; color: #ff9e64; }
  #status { font-size: 18px; color: #78909c; }
  #q { font-size: 20px; color: #00d4ff; margin: 10px 0 8px; min-height: 52px; overflow: hidden; }
  #a { font-size: 24px; line-height: 32px; height: 256px; overflow: hidden; color: #fff; }
  #page { font-size: 16px; color: #ff9e64; margin-left: auto; margin-right: 14px; }
  #bar { position: absolute; left: 24px; right: 24px; bottom: 24px; }
  .row { display: flex; gap: 12px; }
  button, input {
    font-size: 22px; padding: 14px 10px; color: #fff; background: #111;
    border: 3px solid #333; border-radius: 14px; font-family: inherit;
  }
  button { flex: 1; }
  input { width: 100%; margin-bottom: 12px; }
  button:focus, input:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,.4); }
  #hint { font-size: 15px; color: #78909c; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>
  <div id="top"><h1>Claude</h1><div id="page"></div><div id="status">ready</div></div>
  <div id="q">Select the box, then speak or write a question.</div>
  <div id="a"></div>
  <div id="bar">
    <input id="ask" data-focusable type="text" placeholder="Ask Claude..." autocomplete="off">
    <div class="row">
      <button id="bRead" data-focusable>Read aloud</button>
      <button id="bStop" data-focusable>Stop</button>
      <button id="bClear" data-focusable>Clear</button>
    </div>
    <div id="hint"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const focusables = [$('ask'), $('bRead'), $('bStop'), $('bClear')];

  // ---- Settings: backend + token come from the URL once, then live in localStorage.
  // The site is public, so NO secrets live in this file. Add them to the URL you
  // paste into the Meta AI app: .../claude/?api=https://your-worker.example&k=TOKEN
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const params = new URLSearchParams(location.search);
  if (params.get('api')) store.set('mrdg_api', params.get('api'));
  if (params.get('k')) store.set('mrdg_key', params.get('k'));
  const API = store.get('mrdg_api') || '';
  const KEY = store.get('mrdg_key') || '';

  let history = [];
  let answerText = '';
  let pageIndex = 0;
  let busy = false;
  let lastSubmitted = '';

  const setStatus = (s) => { $('status').textContent = s; };

  // ---- Paging (no scrolling allowed on the display)
  function renderAnswer() {
    const a = $('a');
    a.textContent = answerText;
    a.scrollTop = 0;
    pageIndex = 0;
    updatePage();
  }
  function pageCount() {
    const a = $('a');
    return Math.max(1, Math.ceil(a.scrollHeight / a.clientHeight));
  }
  function updatePage() {
    const n = pageCount();
    $('page').textContent = n > 1 ? `page ${pageIndex + 1}/${n} ▲▼` : '';
  }
  function movePage(d) {
    const n = pageCount();
    const next = Math.min(n - 1, Math.max(0, pageIndex + d));
    pageIndex = next;
    const a = $('a');
    a.scrollTop = pageIndex * a.clientHeight;
    updatePage();
  }

  // ---- Speech output (supported on the glasses)
  function plain(t) {
    return t.replace(/[*_`#>]/g, '').replace(/\s+/g, ' ').trim();
  }
  function speak(t) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(plain(t));
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeaking() { try { speechSynthesis.cancel(); } catch (e) {} }

  // ---- Ask Claude
  async function callBackend(question) {
    if (!API) {
      // Demo mode: lets you test voice + display on the glasses before a backend exists.
      await new Promise(r => setTimeout(r, 600));
      return 'Demo mode: no Claude backend is connected yet. You asked: "' + question + '".';
    }
    const res = await fetch(API.replace(/\/$/, '') + '/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
      body: JSON.stringify({ question, history: history.slice(-6) }),
    });
    if (!res.ok) throw new Error('Backend returned ' + res.status);
    const data = await res.json();
    return data.answer || '(empty answer)';
  }

  async function ask(question, opts = {}) {
    question = (question || '').trim();
    if (!question || busy) return 'busy or empty';
    busy = true;
    lastSubmitted = question;
    $('q').textContent = question;
    answerText = '';
    renderAnswer();
    setStatus('thinking...');
    try {
      const answer = await callBackend(question);
      history.push({ role: 'user', content: question }, { role: 'assistant', content: answer });
      answerText = answer;
      renderAnswer();
      setStatus('done');
      speak(answer);
    } catch (e) {
      answerText = 'Could not reach Claude: ' + e.message;
      renderAnswer();
      setStatus('error');
    } finally {
      busy = false;
      $('ask').value = '';
    }
    return answerText;
  }

  // ---- Text field: the on-glasses composer fills this in (typing or dictation if offered)
  const input = $('ask');
  input.addEventListener('change', () => ask(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); ask(input.value); }
  });

  $('bRead').onclick = () => { if (answerText) speak(answerText); };
  $('bStop').onclick = stopSpeaking;
  $('bClear').onclick = () => {
    stopSpeaking(); history = []; answerText = ''; renderAnswer();
    $('q').textContent = 'Cleared. Ask something new.'; setStatus('ready');
  };

  // ---- D-pad / Neural Band navigation
  document.addEventListener('keydown', (e) => {
    const i = focusables.indexOf(document.activeElement);
    const inInput = document.activeElement === input;
    if (e.key === 'ArrowDown' && !inInput && i === -1) { e.preventDefault(); movePage(1); return; }
    if (e.key === 'ArrowUp' && !inInput && i === -1) { e.preventDefault(); movePage(-1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); focusables[(i + 1) % focusables.length].focus(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); focusables[(i - 1 + focusables.length) % focusables.length].focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); movePage(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePage(-1); }
    else if (e.key === 'Enter' && !inInput) { e.preventDefault(); if (document.activeElement) document.activeElement.click(); }
    else if ((e.key === 'Escape' || e.key === 'Backspace') && !inInput) { e.preventDefault(); history_back(); }
  });
  function history_back() { window.history.back(); }

  // ---- Voice through Meta AI (WebMCP). Off by default on the glasses; harmless if absent.
  function registerVoiceTool() {
    const ctx = document.modelContext || navigator.modelContext;
    if (!ctx || typeof ctx.registerTool !== 'function') return false;
    ctx.registerTool({
      name: 'ask_claude',
      description: 'Ask Claude a question. The answer appears on the glasses display and is read aloud.',
      inputSchema: {
        type: 'object',
        properties: { question: { type: 'string', description: 'The question to ask Claude, in the wearer\'s own words.' } },
        required: ['question'],
      },
      // Meta AI gives tools 10 seconds, so reply right away and show the answer when it arrives.
      async execute(args) {
        const q = (args && args.question) || '';
        if (!q.trim()) return { content: [{ type: 'text', text: 'No question was given.' }] };
        ask(q);
        return { content: [{ type: 'text', text: 'Asking Claude. The answer will appear on the display and be read aloud.' }] };
      },
    });
    return true;
  }
  let voiceOk = false;
  try { voiceOk = registerVoiceTool(); } catch (e) { voiceOk = false; }

  $('hint').textContent = voiceOk
    ? 'Voice: say "Hey Meta, ask Claude ..." or select the box.'
    : (API ? 'Select the box to ask.' : 'Demo mode (no backend). Select the box to ask.');

  // Handy for testing in a desktop browser.
  window.MRDG = { ask, registerVoiceTool, movePage, state: () => ({ API: !!API, answerText, lastSubmitted }) };

  input.focus();
  updatePage();
})();
</script>
</body>
</html>
