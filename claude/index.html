<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude</title>
<meta name="description" content="Ask Claude from Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  /* No touch-action here: "touch-action: none" on body turns on Meta's drag mode, which
     makes the Neural Band send pointer drags instead of arrow keys / Enter. */
  body { width: 600px; height: 600px; overflow: hidden; padding: 24px; position: relative; }
  [hidden] { display: none !important; }
  button, input {
    font-size: 22px; padding: 14px 10px; color: #fff; background: #111;
    border: 3px solid #333; border-radius: 14px; font-family: inherit;
  }
  button:focus, input:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,.4); }

  /* Picker */
  #picker h1 { font-size: 30px; margin: 0 0 6px; color: #ff9e64; }
  #picker .sub { font-size: 18px; color: #78909c; margin-bottom: 22px; }
  .mode { display: block; width: 100%; text-align: left; padding: 22px 24px; margin-bottom: 18px; }
  .mode .n { font-size: 32px; font-weight: 600; }
  .mode .t { font-size: 19px; color: #b0bec5; margin-top: 6px; }
  .mode .s { font-size: 16px; margin-top: 8px; color: #78909c; }
  .mode .s.on { color: #7CFC9A; }
  #pickHint { position: absolute; bottom: 24px; left: 24px; font-size: 16px; color: #78909c; }

  /* Main */
  #top { display: flex; align-items: baseline; }
  #top h1 { font-size: 26px; margin: 0; color: #ff9e64; }
  #status { font-size: 18px; color: #78909c; }
  #page { font-size: 16px; color: #ff9e64; margin-left: auto; margin-right: 14px; }
  #q { font-size: 20px; color: #00d4ff; margin: 10px 0 8px; min-height: 52px; overflow: hidden; }
  #a { font-size: 24px; line-height: 32px; height: 256px; overflow: hidden; color: #fff; }
  #bar { position: absolute; left: 24px; right: 24px; bottom: 24px; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; padding: 14px 4px; }
  #ask { width: 100%; margin-bottom: 12px; }
  #hint { font-size: 15px; color: #78909c; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<div id="picker">
  <h1>Choose your Claude</h1>
  <div class="sub">Pick where your questions are answered.</div>
  <button class="mode" id="mCloud" data-mode="cloud" data-focusable>
    <div class="n">Cloud Claude</div>
    <div class="t">Always on. Works anywhere, even with your PC off.</div>
    <div class="s" id="sCloud"></div>
  </button>
  <button class="mode" id="mHome" data-mode="home" data-focusable>
    <div class="n">Home Claude</div>
    <div class="t">Runs on your PC. Works only while your PC is on.</div>
    <div class="s" id="sHome"></div>
  </button>
  <div id="pickHint">Up/down to choose, Enter to select.</div>
</div>

<div id="main" hidden>
  <div id="top"><h1 id="title">Claude</h1><div id="page"></div><div id="status">ready</div></div>
  <div id="q">Select the box, then speak or write a question.</div>
  <div id="a"></div>
  <div id="bar">
    <input id="ask" data-focusable type="text" placeholder="Ask Claude..." autocomplete="off">
    <div class="row">
      <button id="bRead" data-focusable>Read</button>
      <button id="bStop" data-focusable>Stop</button>
      <button id="bClear" data-focusable>Clear</button>
      <button id="bSwitch" data-focusable>Switch</button>
    </div>
    <div id="hint"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---- Modes. The site is public, so NO secrets live in this file.
  // Add them to the address you paste into the Meta AI app, for example:
  //   .../claude/?cloud=https://my-worker.workers.dev&ck=TOKEN
  //   .../claude/?home=https://my-tunnel.trycloudflare.com&hk=TOKEN
  // They are saved on the glasses (localStorage) the first time the app loads.
  const MODES = {
    cloud: { name: 'Cloud Claude', urlParam: 'cloud', keyParam: 'ck' },
    home:  { name: 'Home Claude',  urlParam: 'home',  keyParam: 'hk' },
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const params = new URLSearchParams(location.search);
  for (const [id, m] of Object.entries(MODES)) {
    if (params.get(m.urlParam)) store.set('mrdg_' + id + '_url', params.get(m.urlParam));
    if (params.get(m.keyParam)) store.set('mrdg_' + id + '_key', params.get(m.keyParam));
  }
  // Cloud Claude uses the same secret as Home Claude unless it was given its own (?ck=).
  const cfg = (id) => ({
    url: store.get('mrdg_' + id + '_url') || '',
    key: store.get('mrdg_' + id + '_key') || (id === 'cloud' ? store.get('mrdg_home_key') || '' : ''),
  });

  let mode = store.get('mrdg_mode');
  if (!MODES[mode]) mode = null;
  let history = [];
  let answerText = '';
  let pageIndex = 0;
  let busy = false;
  let lastSubmitted = '';

  const picker = $('picker'), main = $('main');
  const modeButtons = [$('mCloud'), $('mHome')];
  const focusables = [$('ask'), $('bRead'), $('bStop'), $('bClear'), $('bSwitch')];
  const onPicker = () => !picker.hidden;

  // ---- Picker screen
  function showPicker() {
    stopSpeaking();
    main.hidden = true; picker.hidden = false;
    const setS = (id, text, on) => {
      const s = $(id === 'cloud' ? 'sCloud' : 'sHome');
      s.textContent = text + (id === mode ? '  ·  last used' : '');
      s.className = 's' + (on ? ' on' : '');
    };
    for (const id of ['cloud', 'home']) setS(id, cfg(id).key ? 'Checking...' : 'Not set up yet (demo)', false);
    (mode === 'home' ? $('mHome') : $('mCloud')).focus();
    // Fill in live status in the background (never blocks choosing).
    for (const id of ['cloud', 'home']) {
      if (!cfg(id).key) continue;
      lookupAddress(id).then((u) => {
        if (onPicker() === false) return;
        if (u) { store.set('mrdg_' + id + '_url', u); setS(id, id === 'home' ? 'On, ready' : 'Ready', true); }
        else if (u === '' && id === 'home') setS(id, 'Off (start it on your PC)', false);
        else if (u === '' || (u === null && !cfg(id).url)) setS(id, id === 'cloud' ? 'Not set up yet (run setup on your PC)' : 'Not found', false);
        else setS(id, 'Connected', true);
      });
    }
  }

  function pick(id) {
    if (!MODES[id]) return;
    mode = id; store.set('mrdg_mode', id);
    history = []; answerText = ''; lastSubmitted = '';
    picker.hidden = true; main.hidden = false;
    // The glasses' Back gesture (Neural Band or touchpad) calls history.back() and sends no
    // key, so give the chat screen its own history entry; Back then returns to the picker.
    if (!(window.history.state && window.history.state.mrdg === 'main')) {
      try { window.history.pushState({ mrdg: 'main' }, ''); } catch (e) {}
    }
    $('title').textContent = MODES[id].name;
    $('q').textContent = 'Select the box, then speak or write a question.';
    $('a').textContent = ''; pageIndex = 0; updatePage();
    setStatus('ready');
    $('hint').textContent = voiceOk
      ? 'Voice: say "Hey Meta, ask Claude ..." or select the box.'
      : (cfg(id).key ? 'Pinch the box to ask. Swipe left/right to move, up/down to page.' : 'Demo mode (not set up yet). Select the box to ask.');
    $('ask').focus();
  }

  const setStatus = (s) => { $('status').textContent = s; };

  // ---- Paging (no scrolling allowed on the display)
  function renderAnswer() {
    const a = $('a');
    a.textContent = answerText;
    a.scrollTop = 0; pageIndex = 0;
    updatePage();
  }
  function pageCount() {
    const a = $('a');
    return Math.max(1, Math.ceil(a.scrollHeight / a.clientHeight));
  }
  function updatePage() {
    const n = pageCount();
    $('page').textContent = n > 1 ? `page ${pageIndex + 1}/${n} ▲▼` : '';
  }
  function movePage(d) {
    const n = pageCount();
    pageIndex = Math.min(n - 1, Math.max(0, pageIndex + d));
    const a = $('a');
    a.scrollTop = pageIndex * a.clientHeight;
    updatePage();
  }

  // ---- Speech output (supported on the glasses)
  const plain = (t) => t.replace(/[*_`#>]/g, '').replace(/\s+/g, ' ').trim();
  function speak(t) {
    try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(plain(t))); } catch (e) {}
  }
  function stopSpeaking() { try { speechSynthesis.cancel(); } catch (e) {} }

  // ---- Ask Claude
  // Home Claude's tunnel address changes each time it starts. The PC publishes the current
  // one (never the token) to a branch of the repo, and we look it up here.
  // Cloud Claude's address is permanent and published the same way by its setup script.
  const addrSources = (file) => [
    'https://api.github.com/repos/BlaineT1/mrdg-glasses/contents/' + file + '?ref=home-address',
    'https://raw.githubusercontent.com/BlaineT1/mrdg-glasses/home-address/' + file,
  ];
  // Returns the current address, '' if it is switched off / not set up, or null if it can't be looked up.
  const lookupHomeAddress = () => lookupAddress('home');
  async function lookupAddress(id) {
    for (const src of addrSources(id === 'cloud' ? 'cloud.json' : 'home.json')) {
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 5000);
        const r = await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
        clearTimeout(timer);
        if (!r.ok) continue;
        const d = await r.json();
        const j = d.content ? JSON.parse(atob(d.content.replace(/\n/g, ''))) : d;
        if (typeof j.url === 'string') return j.url;
      } catch (e) { /* try the next source */ }
    }
    // A missing cloud.json (404 from both) just means Cloud Claude isn't set up yet.
    return null;
  }
  const friendly = (msg) => { const e = new Error(msg); e.friendly = true; return e; };
  const OFF_MSG = 'Home Claude is turned off. Start it on your PC, then try again.';

  async function post(url, key, question) {
    const res = await fetch(url.replace(/\/$/, '') + '/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ question, history: history.slice(-6) }),
    });
    if (res.status === 401) throw friendly(MODES[mode].name + ' rejected the saved token. Re-add the app with the latest address.');
    if (res.status === 503 && mode === 'cloud') throw friendly('Cloud Claude needs its API key. On your PC, run "Set up Cloud Claude".');
    if (res.status === 429) throw friendly(MODES[mode].name + ' is busy. Try again in a moment.');
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error || ''; } catch (e) {}
      throw friendly(MODES[mode].name + ' had a problem (' + res.status + (detail ? ': ' + detail : '') + ').');
    }
    const data = await res.json();
    return data.answer || '(empty answer)';
  }

  async function callBackend(question) {
    let { url, key } = cfg(mode);
    const demo = async () => {
      await new Promise(r => setTimeout(r, 600));
      return 'Demo mode: ' + MODES[mode].name + ' is not set up yet. You asked: "' + question + '".';
    };
    if (mode === 'home') {
      if (!key) return demo();
      const found = await lookupHomeAddress();
      if (found === '') throw friendly(OFF_MSG);
      if (found) { url = found; store.set('mrdg_home_url', found); }
      if (!url) throw friendly('Could not find Home Claude. Is it running on your PC?');
      try {
        return await post(url, key, question);
      } catch (e) {
        if (e instanceof TypeError) { // network failure: the address may have just changed
          const again = await lookupHomeAddress();
          if (again === '') throw friendly(OFF_MSG);
          if (again && again !== url) { store.set('mrdg_home_url', again); return await post(again, key, question); }
        }
        throw e;
      }
    }
    // Cloud: the address never changes, so look it up only until we have it.
    if (!key) return demo();
    if (!url) {
      const found = await lookupAddress('cloud');
      if (found) { url = found; store.set('mrdg_cloud_url', found); }
    }
    if (!url) throw friendly('Cloud Claude is not set up yet. On your PC, run "Set up Cloud Claude", then try again.');
    return post(url, key, question);
  }

  async function ask(question) {
    question = (question || '').trim();
    if (!question || busy) return 'busy or empty';
    // Asked by voice before choosing? Use the last mode (or Cloud) so voice is never blocked.
    if (onPicker() || !mode) pick(mode || 'cloud');
    busy = true;
    lastSubmitted = question;
    $('q').textContent = question;
    answerText = ''; renderAnswer();
    setStatus('thinking...');
    try {
      const answer = await callBackend(question);
      history.push({ role: 'user', content: question }, { role: 'assistant', content: answer });
      answerText = answer; renderAnswer();
      setStatus('done');
      speak(answer);
    } catch (e) {
      answerText = e.friendly ? e.message
        : 'Could not reach ' + MODES[mode].name + ': ' + e.message +
          (mode === 'home' ? '  Is your PC on and Home Claude running?' : '');
      renderAnswer();
      setStatus('error');
    } finally {
      busy = false;
      $('ask').value = '';
    }
    return answerText;
  }

  // ---- Text field: the on-glasses composer fills this in (typing, or dictation if offered)
  const input = $('ask');
  input.addEventListener('change', () => ask(input.value));
  input.addEventListener('keydown', (e) => {
    // With text in the box, Enter sends it. With an empty box, leave Enter alone so the
    // glasses can open their text composer (blocking it stopped the composer opening).
    if (e.key === 'Enter' && input.value.trim()) { e.preventDefault(); ask(input.value); }
  });

  $('bRead').onclick = () => { if (answerText) speak(answerText); };
  $('bStop').onclick = stopSpeaking;
  $('bClear').onclick = () => {
    stopSpeaking(); history = []; answerText = ''; renderAnswer();
    $('q').textContent = 'Cleared. Ask something new.'; setStatus('ready');
  };
  $('bSwitch').onclick = goBack;
  for (const b of modeButtons) b.onclick = () => pick(b.dataset.mode);

  // ---- D-pad / Neural Band navigation
  document.addEventListener('keydown', (e) => {
    if (onPicker()) {
      const i = modeButtons.indexOf(document.activeElement);
      if (['ArrowDown', 'ArrowRight'].includes(e.key)) { e.preventDefault(); modeButtons[(i + 1) % 2].focus(); }
      else if (['ArrowUp', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); modeButtons[(i + 1) % 2].focus(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (i >= 0) pick(modeButtons[i].dataset.mode); }
      else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); window.history.back(); }
      return;
    }
    const i = focusables.indexOf(document.activeElement);
    const inInput = document.activeElement === input;
    if (e.key === 'ArrowRight') { e.preventDefault(); focusables[(i + 1) % focusables.length].focus(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); focusables[(i - 1 + focusables.length) % focusables.length].focus(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); movePage(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePage(-1); }
    else if (e.key === 'Enter' && !inInput) { e.preventDefault(); if (document.activeElement) document.activeElement.click(); }
    else if (e.key === 'Escape' || (e.key === 'Backspace' && (!inInput || input.value === ''))) { e.preventDefault(); goBack(); }
  });
  // If nothing has focus (it can be lost after the composer closes), the first key brings it back.
  document.addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement !== document.body) return;
    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    (onPicker() ? (mode === 'home' ? $('mHome') : $('mCloud')) : input).focus();
  }, true);

  // Back: from the chat screen go to the picker through history, so the system Back gesture,
  // Escape and the Switch button all behave the same.
  function goBack() {
    if (window.history.state && window.history.state.mrdg === 'main') window.history.back();
    else showPicker();
  }
  window.addEventListener('popstate', () => { if (!onPicker()) showPicker(); });

  // Safety net: if the glasses ever deliver band movement as pointer drags instead of keys,
  // turn a clear swipe into the matching arrow key so navigation still works.
  let down = null;
  document.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
  document.addEventListener('pointerup', (e) => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 60) return;
    const key = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
    (document.activeElement || document.body).dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
  });

  // ---- Voice through Meta AI (WebMCP). Off by default on the glasses; harmless if absent.
  function registerVoiceTool() {
    const ctx = document.modelContext || navigator.modelContext;
    if (!ctx || typeof ctx.registerTool !== 'function') return false;
    ctx.registerTool({
      name: 'ask_claude',
      description: 'Ask Claude a question. The answer appears on the glasses display and is read aloud.',
      inputSchema: {
        type: 'object',
        properties: { question: { type: 'string', description: 'The question to ask Claude, in the wearer\'s own words.' } },
        required: ['question'],
      },
      // Meta AI gives tools 10 seconds, so reply right away and show the answer when it arrives.
      async execute(args) {
        const q = (args && args.question) || '';
        if (!q.trim()) return { content: [{ type: 'text', text: 'No question was given.' }] };
        ask(q);
        return { content: [{ type: 'text', text: 'Asking Claude. The answer will appear on the display and be read aloud.' }] };
      },
    });
    return true;
  }
  let voiceOk = false;
  try { voiceOk = registerVoiceTool(); } catch (e) { voiceOk = false; }

  // Handy for testing in a desktop browser.
  window.MRDG = { ask, pick, showPicker, registerVoiceTool, movePage, state: () => ({ mode, answerText, lastSubmitted, picker: onPicker() }) };

  showPicker();
})();
</script>
</body>
</html>
