<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>PC Remote</title>
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<style>
  /* No touch-action on body: it would switch the Neural Band to drag mode. */
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  body { width: 600px; height: 600px; overflow: hidden; padding: 22px 26px; box-sizing: border-box; position: relative; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 30px; margin: 0; color: #00d4ff; }
  #pc { font-size: 19px; color: #9aa; }
  #pc.on { color: #4f8; }
  #pc.off { color: #fa4; }
  button {
    font: inherit; font-size: 24px; color: #fff; background: #111; border: 3px solid #333; border-radius: 16px;
    padding: 14px 16px; text-align: left; cursor: pointer;
  }
  button:focus { outline: none; border-color: #00d4ff; background: #06222b; box-shadow: 0 0 22px rgba(0,212,255,.45); }
  button .sub { display: block; font-size: 18px; color: #9ab; margin-top: 4px; }
  button.danger:focus { border-color: #ff6a4d; background: #2b0d06; box-shadow: 0 0 22px rgba(255,106,77,.45); }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .list button { padding: 18px 20px; font-size: 27px; }
  .grid { display: grid; gap: 12px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .grid button { text-align: center; padding: 12px 6px; min-height: 104px; }
  .grid .ic { display: block; font-size: 36px; line-height: 1.1; }
  .grid .lb { display: block; font-size: 20px; margin-top: 4px; }
  .grid.g2 button { min-height: 86px; }
  h2 { font-size: 26px; margin: 0 0 12px; }
  .vol { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; font-size: 24px; }
  .bar { flex: 1; height: 18px; border: 2px solid #446; border-radius: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #00d4ff; transition: width .2s; }
  .bar.muted i { background: #556; }
  .banner { background: #3a1a00; border: 2px solid #fa4; border-radius: 12px; padding: 10px 14px; font-size: 21px; margin-bottom: 12px; }
  .rows { font-size: 24px; margin: 0 0 16px; }
  .rows div { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #222; }
  .dot { font-weight: 700; }
  .dot.up { color: #4f8; } .dot.down { color: #f66; }
  .confirm p { font-size: 22px; line-height: 1.35; color: #ccd; margin: 0 0 22px; }
  .confirm h2 { font-size: 32px; }
  #msg { position: absolute; left: 26px; right: 26px; bottom: 20px; font-size: 20px; color: #cde; min-height: 26px; }
  #msg.err { color: #fa4; }
  .hint { position: absolute; left: 26px; right: 26px; bottom: 52px; font-size: 17px; color: #778; }
</style>
</head>
<body>
  <header><h1 id="title">PC Remote</h1><span id="pc">Checking...</span></header>

  <section id="s-home" class="list">
    <button data-focusable data-go="media">Media &amp; volume<span class="sub" id="homeVol">&nbsp;</span></button>
    <button data-focusable data-go="power">Lock &amp; power<span class="sub" id="homePower">Lock, screen off, sleep, restart</span></button>
    <button data-focusable data-go="nest">Nest<span class="sub" id="homeNest">&nbsp;</span></button>
  </section>

  <section id="s-media" hidden>
    <div class="vol"><span id="volText">--%</span><div class="bar" id="volBar"><i></i></div></div>
    <div class="grid g3">
      <button data-focusable data-act="media_prev"><span class="ic">&#9198;</span><span class="lb">Previous</span></button>
      <button data-focusable data-act="media_play"><span class="ic">&#9199;</span><span class="lb">Play / pause</span></button>
      <button data-focusable data-act="media_next"><span class="ic">&#9197;</span><span class="lb">Next</span></button>
      <button data-focusable data-act="vol_down"><span class="ic">&minus;</span><span class="lb">Volume down</span></button>
      <button data-focusable data-act="vol_mute"><span class="ic" id="muteIc">&#128263;</span><span class="lb" id="muteLb">Mute</span></button>
      <button data-focusable data-act="vol_up"><span class="ic">+</span><span class="lb">Volume up</span></button>
    </div>
  </section>

  <section id="s-power" hidden>
    <div class="banner" id="powerBanner" hidden></div>
    <div class="grid g2">
      <button data-focusable data-act="cancel_power" id="bCancel" hidden><span class="lb">Cancel shutdown</span></button>
      <button data-focusable data-act="lock"><span class="lb">Lock PC</span></button>
      <button data-focusable data-act="screen_off"><span class="lb">Screen off</span></button>
      <button data-focusable data-ask="sleep" class="danger"><span class="lb">Sleep</span></button>
      <button data-focusable data-ask="restart" class="danger"><span class="lb">Restart</span></button>
      <button data-focusable data-ask="shutdown" class="danger"><span class="lb">Shut down</span></button>
    </div>
  </section>

  <section id="s-nest" hidden>
    <div class="rows">
      <div>Database <span class="dot" id="nDb">?</span></div>
      <div>API server <span class="dot" id="nApi">?</span></div>
      <div>Web server <span class="dot" id="nWeb">?</span></div>
    </div>
    <div class="grid g2">
      <button data-focusable data-act="nest_start"><span class="lb">Start Nest</span></button>
      <button data-focusable data-act="nest_stop"><span class="lb">Stop Nest</span></button>
    </div>
  </section>

  <section id="s-confirm" class="confirm" hidden>
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <div class="grid g2">
      <button data-focusable id="cNo"><span class="lb">No, go back</span></button>
      <button data-focusable id="cYes" class="danger"><span class="lb" id="cYesLb">Yes</span></button>
    </div>
  </section>

  <div class="hint" id="hint"></div>
  <div id="msg"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // The site is public, so no secrets live in this file. The key comes from the address
  // (?hk=KEY, same key as Home Claude) and is kept on the glasses.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const params = new URLSearchParams(location.search);
  if (params.get('hk')) store.set('mrdg_home_key', params.get('hk'));
  const fixedUrl = params.get('home') || '';   // for testing on the PC
  if (params.has('hk') || params.has('home')) {
    try { history.replaceState(history.state, '', location.pathname); } catch (e) {} // keep the key out of sight
  }
  const key = () => store.get('mrdg_home_key') || '';

  // ---- finding Home Claude (its tunnel address changes; the PC publishes it, never the key)
  const addrSources = [
    'https://api.github.com/repos/BlaineT1/mrdg-glasses/contents/home.json?ref=home-address',
    'https://raw.githubusercontent.com/BlaineT1/mrdg-glasses/home-address/home.json',
  ];
  let lookedUp = 0;
  async function lookup() {   // url, '' if Home Claude is off, null if unknown
    if (fixedUrl) return fixedUrl;
    for (const src of addrSources) {
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 5000);
        const r = await fetch(src + (src.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
        clearTimeout(timer);
        if (!r.ok) continue;
        const d = await r.json();
        const j = d.content ? JSON.parse(atob(d.content.replace(/\n/g, ''))) : d;
        if (typeof j.url === 'string') { lookedUp = Date.now(); if (j.url) store.set('mrdg_home_url', j.url); return j.url; }
      } catch (e) { /* next source */ }
    }
    return null;
  }

  const OFF = 'Home Claude is off. Start it on your PC.';
  let online = null;   // true / false / null (unknown)
  function setPc(state, text) {
    online = state;
    $('pc').textContent = text;
    $('pc').className = state === true ? 'on' : state === false ? 'off' : '';
  }

  async function post(url, body) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(url.replace(/\/$/, '') + '/remote', {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key() },
        body: JSON.stringify(body),
      });
      let d = {};
      try { d = await r.json(); } catch (e) {}
      if (r.status === 401) throw new Error('The PC rejected the saved key. Re-add the remote with the address in glasses-url.txt.');
      if (r.status === 404) throw new Error('Home Claude on the PC needs a restart to turn the remote on.');
      if (r.status === 429) throw new Error('Too many presses. Wait a moment.');
      if (!r.ok || !d.ok) throw new Error(d.error ? 'PC: ' + d.error : 'The PC had a problem (' + r.status + ').');
      return d;
    } finally { clearTimeout(timer); }
  }
  // Sends one action. Re-finds the address once if the old one stopped answering.
  async function call(action, confirm) {
    if (!key()) throw new Error('Not set up: open the remote with the address from glasses-url.txt.');
    let url = (Date.now() - lookedUp < 60000 && store.get('mrdg_home_url')) || await lookup();
    if (url === '') { setPc(false, 'PC: off'); throw new Error(OFF); }
    if (!url) url = store.get('mrdg_home_url') || '';
    if (!url) throw new Error('Could not find the PC. Is Home Claude running?');
    try {
      const d = await post(url, { action, confirm });
      setPc(true, 'PC: online');
      return d;
    } catch (e) {
      if (e.name !== 'TypeError' && e.name !== 'AbortError') throw e;
      const again = await lookup();
      if (again === '') { setPc(false, 'PC: off'); throw new Error(OFF); }
      if (again && again !== url) { const d = await post(again, { action, confirm }); setPc(true, 'PC: online'); return d; }
      setPc(false, 'PC: no answer');
      throw new Error('The PC is not answering. It may be asleep or off.');
    }
  }

  // ---- showing status
  let last = null;
  function render(s) {
    if (!s) return;
    last = s;
    const v = s.volume;
    const vt = v == null ? '--' : v + '%';
    $('volText').textContent = s.muted ? 'Muted (' + vt + ')' : vt;
    $('volBar').firstElementChild.style.width = (v || 0) + '%';
    $('volBar').classList.toggle('muted', !!s.muted);
    $('muteLb').textContent = s.muted ? 'Unmute' : 'Mute';
    $('muteIc').innerHTML = s.muted ? '&#128266;' : '&#128263;';
    $('homeVol').textContent = 'Volume ' + (s.muted ? 'muted' : vt);

    const p = s.power;
    const onCancel = document.activeElement === $('bCancel');
    $('powerBanner').hidden = !p;
    $('bCancel').hidden = !p;
    if (p) $('powerBanner').textContent = (p.kind === 'restart' ? 'Restarting' : 'Shutting down') + ' in ' + p.inSec + ' s.';
    $('homePower').textContent = p ? ((p.kind === 'restart' ? 'Restarting' : 'Shutting down') + ' in ' + p.inSec + ' s') : 'Lock, screen off, sleep, restart';
    if (!p && onCancel && screen === 'power') focusFirst();

    const n = s.nest || {};
    const dot = (id, up) => { $(id).textContent = up ? 'running' : 'stopped'; $(id).className = 'dot ' + (up ? 'up' : 'down'); };
    dot('nDb', n.database); dot('nApi', n.api); dot('nWeb', n.web);
    const allUp = n.database && n.api && n.web;
    $('homeNest').textContent = n.phase === 'starting' || n.phase === 'stopping' ? n.message
      : allUp ? 'Running' : (n.database || n.api || n.web) ? 'Partly running' : 'Stopped';
    if (screen === 'nest' && (n.phase || n.message) && !msgHeld()) showMsg(n.message, n.phase === 'error');
  }

  let msgUntil = 0;
  const msgHeld = () => Date.now() < msgUntil;
  function showMsg(t, err, holdMs) {
    $('msg').textContent = t || '';
    $('msg').className = err ? 'err' : '';
    msgUntil = holdMs ? Date.now() + holdMs : 0;
  }

  let polling = false;
  async function refresh() {
    if (polling || document.hidden) return;
    polling = true;
    try { render((await call('status')).status); if (!msgHeld() && screen !== 'nest' && /off|answering|find|Not set up/.test($('msg').textContent)) showMsg(''); }
    catch (e) { if (!msgHeld()) showMsg(e.message, true); }
    finally { polling = false; }
  }
  let pollTimer = null;
  function schedulePoll() {
    clearTimeout(pollTimer);
    const ms = screen === 'nest' ? 2500 : (last && last.power) ? 1000 : 5000;
    pollTimer = setTimeout(async () => { await refresh(); schedulePoll(); }, ms);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); schedulePoll(); } });

  // ---- actions
  const DONE = {
    lock: 'Locked. Media and volume still work.',
    screen_off: 'Screen off. Move the mouse to wake it.',
    sleep: 'The PC is going to sleep. The remote is offline until it wakes.',
    restart: 'Restarting in 30 s. Cancel is on this screen.',
    shutdown: 'Shutting down in 30 s. Cancel is on this screen.',
    nest_start: 'Starting Nest (Docker can take a minute)...',
    nest_stop: 'Stopping Nest...',
    media_play: 'Play / pause', media_next: 'Next track', media_prev: 'Previous track',
  };
  let sending = 0;
  async function act(action, confirm) {
    sending++;
    showMsg('...', false);
    try {
      const d = await call(action, confirm);
      render(d.status);
      showMsg(d.note || DONE[action] || '', false, 4000);
      if (action === 'restart' || action === 'shutdown') { show('power'); setTimeout(() => $('bCancel').focus(), 0); }
      schedulePoll();
    } catch (e) { showMsg(e.message, true, 6000); }
    finally { sending--; }
  }

  const ASK = {
    sleep: ['Put the PC to sleep?', 'It sleeps in a few seconds. The remote and Home Claude are offline until you wake the PC.', 'Yes, sleep'],
    restart: ['Restart the PC?', 'It restarts in 30 seconds (you can cancel). Unsaved work in open apps will be lost. The remote is back after you sign in.', 'Yes, restart'],
    shutdown: ['Shut down the PC?', 'It shuts down in 30 seconds (you can cancel). Unsaved work in open apps will be lost. The remote stays offline until the PC is turned on and you sign in.', 'Yes, shut down'],
  };
  let asking = null;
  function openConfirm(kind) {
    asking = kind;
    $('cTitle').textContent = ASK[kind][0];
    $('cText').textContent = ASK[kind][1];
    $('cYesLb').textContent = ASK[kind][2];
    go('confirm');
  }
  $('cNo').addEventListener('click', () => history.back());
  $('cYes').addEventListener('click', () => {
    const kind = asking; asking = null;
    history.back();             // back to the power screen first...
    setTimeout(() => act(kind, true), 0); // ...then send, so its message stays on screen
  });

  // ---- screens (inner screens get a history entry so the Back gesture returns here)
  const TITLES = { home: 'PC Remote', media: 'Media', power: 'Lock & power', nest: 'Nest', confirm: 'Are you sure?' };
  const HINTS = {
    home: 'Swipe to choose, pinch to open.',
    media: 'Swipe to move, pinch to press. Back to return.',
    power: 'Sleep, restart and shut down ask first.',
    nest: 'Database, API (port 4000) and web (5173).',
    confirm: '',
  };
  let screen = 'home';
  function show(s) {
    if (!TITLES[s]) s = 'home';
    screen = s;
    for (const id of Object.keys(TITLES)) $('s-' + id).hidden = id !== s;
    $('title').textContent = TITLES[s];
    $('hint').textContent = HINTS[s];
    if (!msgHeld()) showMsg('');
    if (last) render(last);
    focusFirst();
    schedulePoll();
  }
  function go(s) {
    try { history.pushState({ s }, ''); } catch (e) {}
    show(s);
    if (s === 'nest') refresh();
  }
  window.addEventListener('popstate', (e) => {
    const s = e.state && e.state.s;
    show(s === 'confirm' ? 'power' : (s || 'home'));
  });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.go) go(b.dataset.go);
    else if (b.dataset.act) act(b.dataset.act);
    else if (b.dataset.ask) openConfirm(b.dataset.ask);
  });

  // ---- focus and keys (Neural Band / touchpad send arrows + Enter)
  const items = () => [...document.querySelectorAll('[data-focusable]')].filter((el) => el.offsetParent !== null);
  function focusFirst() {
    const list = items();
    if (screen === 'confirm') return $('cNo').focus();
    if (list.length) list[0].focus();
  }
  // Moves to the nearest control in that direction; wraps around in reading order.
  function move(dx, dy) {
    const list = items();
    const cur = document.activeElement;
    if (!list.includes(cur)) return focusFirst();
    const r = cur.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = null, bestScore = Infinity;
    for (const el of list) {
      if (el === cur) continue;
      const b = el.getBoundingClientRect();
      const x = b.left + b.width / 2 - cx, y = b.top + b.height / 2 - cy;
      const along = dx ? x * dx : y * dy;
      if (along <= 4) continue;
      const score = along + 3 * (dx ? Math.abs(y) : Math.abs(x));
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (!best) {
      const i = list.indexOf(cur), step = dx || dy;
      best = list[(i + step + list.length) % list.length];
    }
    best.focus();
  }
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowRight') { e.preventDefault(); move(1, 0); }
    else if (k === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }
    else if (k === 'ArrowDown') { e.preventDefault(); move(0, 1); }
    else if (k === 'ArrowUp') { e.preventDefault(); move(0, -1); }
    else if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (e.repeat) return;
      if (!items().includes(document.activeElement)) return focusFirst();
      document.activeElement.click();
    }
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); if (screen !== 'home') history.back(); }
  });

  // ---- start
  const st = history.state && history.state.s;
  if (st && st !== 'confirm') show(st); else show('home');
  if (!key()) { setPc(null, 'Not set up'); showMsg('Open the remote with the address from glasses-url.txt on your PC.', true); }
  else refresh();
})();
</script>
</body></html>
