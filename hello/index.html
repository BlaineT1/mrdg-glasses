<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MRDG Hello</title>
<meta name="description" content="MRDG hello app for Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { width: 600px; height: 600px; overflow: hidden; padding: 28px; }
  h1 { font-size: 28px; margin: 0 0 4px; color: #00d4ff; }
  #clock { font-size: 64px; font-weight: 600; margin: 8px 0 16px; }
  #msg { font-size: 22px; min-height: 30px; margin-bottom: 18px; color: #cfd8dc; }
  .row { display: flex; gap: 14px; }
  button {
    flex: 1; font-size: 24px; padding: 18px 10px; color: #fff; background: #111;
    border: 3px solid #333; border-radius: 14px;
  }
  button:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,.4); }
  #hint { position: absolute; bottom: 24px; left: 28px; font-size: 18px; color: #78909c; }
</style>
</head>
<body>
  <h1>MRDG</h1>
  <div id="clock">--:--</div>
  <div id="msg">Hello from your PC!</div>
  <div class="row">
    <button id="b1" data-focusable>Greet</button>
    <button id="b2" data-focusable>Count: 0</button>
    <button id="b3" data-focusable>Speak</button>
  </div>
  <div id="hint">Arrows move · Enter selects · Back to exit</div>

<script>
  const $ = (id) => document.getElementById(id);
  const buttons = [...document.querySelectorAll('button')];

  function tick() {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  tick(); setInterval(tick, 1000);

  let count = 0;
  $('b1').onclick = () => { $('msg').textContent = 'Hi Aiden! It works.'; };
  $('b2').onclick = () => { count++; $('b2').textContent = 'Count: ' + count; };
  $('b3').onclick = () => {
    try { speechSynthesis.speak(new SpeechSynthesisUtterance('Hello from M R D G')); } catch (e) {}
    $('msg').textContent = 'Speaking...';
  };

  document.addEventListener('keydown', (e) => {
    const i = buttons.indexOf(document.activeElement);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault(); buttons[(i + 1 + buttons.length) % buttons.length].focus();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); buttons[(i - 1 + buttons.length) % buttons.length].focus();
    } else if (e.key === 'Enter') {
      e.preventDefault(); if (document.activeElement) document.activeElement.click();
    } else if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault(); history.back();
    }
  });

  buttons[0].focus();
</script>
</body>
</html>
